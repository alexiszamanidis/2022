name: Node.js CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

permissions:
    contents: write
    pages: write

jobs:
    build:
        runs-on: ubuntu-latest

        env:
            NEXT_PUBLIC_BASE_PATH: /2022
            NODE_OPTIONS: --openssl-legacy-provider

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: yarn

            - run: yarn

            - run: yarn jest --watchAll=false --ci

            # next export cannot include API routes; this stub is unused in the static site
            - name: Build and export static site
              run: |
                  rm -rf pages/api
                  yarn build
                  yarn export
                  touch ./out/.nojekyll

            - name: Deploy 🚀
              if: github.event_name == 'push' && github.ref == 'refs/heads/master'
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  branch: gh-pages
                  folder: out

            - name: Enable GitHub Pages
              if: github.event_name == 'push' && github.ref == 'refs/heads/master'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh api --method POST \
                    -H "Accept: application/vnd.github+json" \
                    /repos/${{ github.repository }}/pages \
                    -f build_type=legacy \
                    -f source[branch]=gh-pages \
                    -f source[path]=/ || true
